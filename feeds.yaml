# Feed registry for fetch_feeds.py — no credentials needed for any of these.
# Flat "- url" lines so the script reads it without a YAML dependency.
#
# Add one:  python3 fetch_feeds.py --add https://example.substack.com/feed

# --- Proven working from the GitHub relay (2026-08-26)
- https://daily.bandcamp.com/feed
- https://www.stereogum.com/feed
- https://pitchfork.com/feed/feed-album-reviews/rss
- https://www.thelineofbestfit.com/feed

# --- Canadian / Québec. Real feeds live on FeedBurner; exclaim.ca/rss/music
#     was a guess and 404s.
- https://feeds.feedburner.com/ExclaimCaAllArticles

# --- Substack: individual weekly roundups, ahead of critical consensus.
#     This is the signal we wanted from Reddit.
#     STATUS: all four return 403 from the GitHub runner — Substack blocks
#     datacenter IPs. v0.2.0 retries with a second User-Agent; if they still
#     fail, run fetch_feeds.py on your Mac, where the residential IP is fine.
- https://breadandbuttermusic.substack.com/feed
- https://numusicmonday.substack.com/feed
- https://spaceofsound.substack.com/feed
- https://indiescientist.substack.com/feed

